ulse-3"><circle cx="930" cy="230" r="6" fill="#f43f5e"/><circle cx="970" cy="250" r="8" fill="#ec4899"/><circle cx="950" cy="200" r="5" fill="#fb7185"/><circle cx="990" cy="220" r="7" fill="#e11d48"/></g><rect width="1196" height="336" x="2" y="2" fill="none" stroke="url(#cyanPurple)" stroke-width="1.8" opacity=".4" rx="19"/><g id="foreground-content" filter="url(#shadow)"><g transform="translate(600, 60)"><rect width="280" height="36" x="-140" y="-18" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.2" rx="18"/><text x="0" y="5" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">SINGLE-CELL &amp; MULTI-OMICS</text></g><text x="600" y="145" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Single-Cell Genomics 🧬</text><text x="600" y="195" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">Curated Index of SaaS Platforms, Open-Source Pipelines &amp; AI Foundation Models</text><g><g transform="translate(600, 248) translate(-320, 0)"><rect width="130" height="32" x="-65" y="-16" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="16"/><text x="0" y="5" fill="#7dd3fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔬 scRNA-seq</text></g><g transform="translate(600, 248) translate(-160, 0)"><rect width="140" height="32" x="-70" y="-16" fill="#1e293b" stroke="#818cf8" stroke-opacity=".6" stroke-width="1.2" rx="16"/><text x="0" y="5" fill="#a5b4fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🗺️ Spa