<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCluster {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes floatWave {
      0% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(-25px) translateY(8px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes orbitSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .node-pulse-1 { animation: pulseCluster 4s ease-in-out infinite; transform-origin: 150px 180px; }
    .node-pulse-2 { animation: pulseCluster 5s ease-in-out infinite 1.5s; transform-origin: 1050px 140px; }
    .node-pulse-3 { animation: pulseCluster 3.5s ease-in-out infinite 0.8s; transform-origin: 940px 240px; }
    .floating-layer { animation: floatWave 8s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 12; animation: waveFlow 25s linear infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Glow Spheres (Background) -->
  <circle cx="220" cy="90" r="180" fill="url(#glow1)" />
  <circle cx="980" cy="220" r="220" fill="url(#glow2)" />

  <!-- Dynamic Animated Background Layer: Single-Cell Clustering / DNA Waves -->
  <g class="floating-layer" opacity="0.65">
    <!-- Connecting Gene Expression Graph Edges -->
    <path class="flow-line" d="M 80,120 Q 200,60 320,130 T 560,110 T 820,160 T 1120,110" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.35" />
    <path class="flow-line" d="M 60,220 Q 240,280 440,210 T 780,240 T 1000,180 T 1140,260" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.35" />
    <path d="M 120,150 L 160,200 L 220,170 L 170,120 Z" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.25" />
    <path d="M 980,110 L 1040,160 L 1090,120 L 1030,80 Z" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.25" />
    <path d="M 920,220 L 960,260 L 1020,230 L 970,190 Z" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.25" />
  </g>

  <!-- Dynamic UMAP Single-Cell Clusters (Left & Right Flanks) -->
  <g class="node-pulse-1">
    <circle cx="130" cy="140" r="6" fill="#38bdf8" />
    <circle cx="160" cy="190" r="8" fill="#06b6d4" />
    <circle cx="190" cy="150" r="5" fill="#67e8f9" />
    <circle cx="110" cy="180" r="7" fill="#0284c7" />
    <circle cx="140" cy="220" r="4" fill="#38bdf8" />
  </g>

  <g class="node-pulse-2">
    <circle cx="1020" cy="110" r="7" fill="#c084fc" />
    <circle cx="1060" cy="150" r="9" fill="#a855f7" />
    <circle cx="1100" cy="120" r="5" fill="#e879f9" />
    <circle cx="1040" cy="180" r="6" fill="#9333ea" />
    <circle cx="1080" cy="80" r="4" fill="#d8b4fe" />
  </g>

  <g class="node-pulse-3">
    <circle cx="930" cy="230" r="6" fill="#f43f5e" />
    <circle cx="970" cy="250" r="8" fill="#ec4899" />
    <circle cx="950" cy="200" r="5" fill="#fb7185" />
    <circle cx="990" cy="220" r="7" fill="#e11d48" />
  </g>

  <!-- Animated Border Outline Glow -->
  <rect x="2" y="2" width="1196" height="336" rx="19" fill="none" stroke="url(#cyanPurple)" stroke-width="1.8" opacity="0.4" />

  <!-- FOREGROUND CONTENT: Guaranteed completely visible & unobstructed -->
  <g id="foreground-content" filter="url(#shadow)">
    <!-- Top Category Eyebrow Pill -->
    <g transform="translate(600, 60)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="0" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
        SINGLE-CELL &amp; MULTI-OMICS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">
      Awesome Single-Cell Genomics 🧬
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">
      Curated Index of SaaS Platforms, Open-Source Pipelines &amp; AI Foundation Models
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(600, 248)">
      <!-- Pill 1: scRNA-seq -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">🔬 scRNA-seq</text>
      </g>

      <!-- Pill 2: Spatial Biology -->
      <g transform="translate(-160, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">🗺️ Spatial Omics</text>
      </g>

      <!-- Pill 3: Foundation Models -->
      <g transform="translate(15, 0)">
        <rect x="-78" y="-16" width="156" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe" text-anchor="middle">🤖 Foundation Models</text>
      </g>

      <!-- Pill 4: Multi-Omics Integration -->
      <g transform="translate(195, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbcfe8" text-anchor="middle">🧩 Multi-Omics</text>
      </g>

      <!-- Pill 5: Cloud & Open-Source -->
      <g transform="translate(360, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">⚡ Cloud &amp; OSS</text>
      </g>
    </g>
  </g>
</svg>
